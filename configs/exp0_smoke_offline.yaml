# Offline smoke test: NumPy simulator, bundled digits dataset. Runs anywhere in ~1 min.
name: exp0_smoke_offline
dataset: {name: digits, classes: [3, 8], n_components: 8}
model: {kind: shallow_reference, n_qubits: 8, observable: local, learning_rate: 0.1, max_steps: 100}
grid: {n_layers: [1, 2]}
orderings: [heuristic, default, reversed, anti_heuristic]
seeds: [0, 1]
